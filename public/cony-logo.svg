<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="warmBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="70%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </radialGradient>
    
    <!-- Terracotta / Gold Gradient -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Golden Ring Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Warm Fire Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#451a03" flood-opacity="0.15" />
    </filter>

    <path id="textCircleTop" d="M 75, 250 A 175,175 0 0,1 425,250" />
    <path id="textCircleBottom" d="M 410, 260 A 165,165 0 0,1 90,260" />
  </defs>

  <!-- Outer Protective Base -->
  <circle cx="250" cy="250" r="240" fill="url(#warmBg)" filter="url(#softShadow)" />

  <!-- Outer Aztec / Mexican Decorative Ring -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="#78350f" stroke-width="3" />
  
  <!-- Middle Ring with Terracotta Fill for Header Arc -->
  <circle cx="250" cy="250" r="212" fill="#78350f" />
  <circle cx="250" cy="250" r="148" fill="#fffbeb" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Circular Text: BM DESAYUNOS CONY -->
  <text fill="#ffffff" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="900" font-size="28" letter-spacing="4">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      BM DESAYUNOS CONY
    </textPath>
  </text>

  <!-- Bottom Text: SABOR DE HOGAR · AL COMAL -->
  <text fill="#fef3c7" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="700" font-size="16" letter-spacing="3">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ SABOR DE HOGAR · AL COMAL ★
    </textPath>
  </text>

  <!-- Decorative Stars on Ring Sides -->
  <circle cx="68" cy="250" r="6" fill="#fbbf24" />
  <circle cx="432" cy="250" r="6" fill="#fbbf24" />

  <!-- Inner Illustration: Traditional Comal & Steam of Home-cooked Breakfast -->
  <g transform="translate(250, 240)">
    <!-- Comal Stove Base -->
    <ellipse cx="0" cy="40" rx="85" ry="24" fill="#382013" opacity="0.15" />
    <ellipse cx="0" cy="32" rx="80" ry="18" fill="#451a03" />
    <ellipse cx="0" cy="30" rx="76" ry="16" fill="url(#terracottaGrad)" />
    
    <!-- Comal Rim Highlight -->
    <ellipse cx="0" cy="29" rx="72" ry="13" fill="#92400e" stroke="#fbbf24" stroke-width="1.5" />

    <!-- Clay Pot / Olla de Barro -->
    <path d="M -32,25 C -45,15 -42,-10 -25,-25 C -15,-32 15,-32 25,-25 C 42,-10 45,15 32,25 Z" fill="url(#terracottaGrad)" stroke="#451a03" stroke-width="3" />
    <!-- Pot Rim -->
    <ellipse cx="0" cy="-25" rx="26" ry="7" fill="#b45309" stroke="#fbbf24" stroke-width="2" />
    <!-- Pot Lid Handle -->
    <ellipse cx="0" cy="-32" rx="7" ry="5" fill="#fbbf24" stroke="#78350f" stroke-width="2" />

    <!-- Folk Art Heart / Hearth Warmth on Olla -->
    <path d="M 0, -2 C 0,-8 -12,-8 -12,-2 C -12,4 0,14 0,14 C 0,14 12,4 12,-2 C 12,-8 0,-8 0,-2 Z" fill="#ef4444" stroke="#fbbf24" stroke-width="1.5" />

    <!-- Side Handles for Olla -->
    <path d="M -34,0 C -44,-2 -44,14 -32,15" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
    <path d="M 34,0 C 44,-2 44,14 32,15" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round" />

    <!-- Steaming Aromas of Fresh Breakfast (Artisanal Steam Swirls) -->
    <path d="M -16, -40 C -22,-52 -10,-60 -15,-75" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
    <path d="M 0, -42 C 6,-56 -4,-66 2,-82" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <path d="M 16, -40 C 22,-52 10,-62 16,-76" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

    <!-- Golden Morning Sunshine Rays -->
    <line x1="-60" y1="-50" x2="-45" y2="-40" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="60" y1="-50" x2="45" y2="-40" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="-70" y1="-25" x2="-55" y2="-20" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="70" y1="-25" x2="55" y2="-20" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Established Ribbon / Badge at Base -->
  <g transform="translate(250, 410)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#92400e" stroke="#fbbf24" stroke-width="2" filter="url(#softShadow)" />
    <text x="0" y="5" fill="#ffffff" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="800" font-size="12" text-anchor="middle" letter-spacing="2">
      DESDE MÉXICO
    </text>
  </g>
</svg>
